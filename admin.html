<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin — QR Inventory</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Arial;max-width:900px;margin:20px auto;padding:10px}
    form{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
    input{padding:.4rem;border:1px solid #ccc;border-radius:6px}
    button{padding:.5rem 1rem;border-radius:6px;cursor:pointer}
    .item-row{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border:1px solid #eee;border-radius:6px}
    .qr-wrap{display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <h1>Admin — Manage Items</h1>

  <!-- LOGIN UI -->
  <div id="loginUI">
    <h2>Sign in</h2>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" required />
      <input id="loginPass" type="password" placeholder="Password" required />
      <button type="submit">Sign in</button>
    </form>
  </div>

  <!-- ADMIN UI (hidden until login) -->
  <div id="adminUI" style="display:none">
    <button onclick="signOut()">Sign out</button>
    <h2>Add New Item</h2>
    <form id="addForm">
      <input id="serial" placeholder="Serial" required />
      <input id="name" placeholder="Name of item" required />
      <input id="processName" placeholder="Process name" required />
      <input id="contractorCode" placeholder="Contractor code" required />
      <button type="submit">Create</button>
    </form>

    <h2>Existing Items</h2>
    <div id="itemsList">Loading...</div>
  </div>

  <!-- QR + Barcode libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    // Firebase config (your project details)
    const firebaseConfig = {
      apiKey: "AIzaSyBVVbccac5EuaxzrB9tWxV97uHrcoTye24",
      authDomain: "qr-testing-b7f43.firebaseapp.com",
      projectId: "qr-testing-b7f43",
      storageBucket: "qr-testing-b7f43.firebasestorage.app",
      messagingSenderId: "860050786667",
      appId: "1:860050786667:web:ef79db3e0741384351a42e",
      measurementId: "G-Y2WJ8GT73N"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    const ADMIN_EMAIL = "chanxi@gmail.com";

    const loginUI = document.getElementById("loginUI");
    const adminUI = document.getElementById("adminUI");
    const loginForm = document.getElementById("loginForm");

    // Login form submit
    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const pass  = document.getElementById("loginPass").value;
      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => alert("Sign-in error: " + err.message));
    });

    // Watch auth state
    auth.onAuthStateChanged(user => {
      if (user && user.email === ADMIN_EMAIL) {
        loginUI.style.display = "none";
        adminUI.style.display = "block";
        initAdminFeatures();
      } else {
        loginUI.style.display = "block";
        adminUI.style.display = "none";
      }
    });

    function signOut(){ auth.signOut(); }

    // --- Admin Firestore functions ---
    function initAdminFeatures(){
      const addForm = document.getElementById("addForm");
      const itemsRef = db.collection("items");

      // Add new item
      addForm.addEventListener("submit", async e => {
        e.preventDefault();
        const serial = document.getElementById("serial").value.trim();
        const name = document.getElementById("name").value.trim();
        const processName = document.getElementById("processName").value.trim();
        const contractorCode = document.getElementById("contractorCode").value.trim();

        const docRef = await itemsRef.add({
          serial, name, processName, contractorCode,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        const publicUrl = `${location.origin}/item.html?id=${docRef.id}`;
        await docRef.update({ publicUrl });
        addForm.reset();
      });

      // List items realtime
      itemsRef.orderBy("createdAt","desc").onSnapshot(snapshot => {
        const container = document.getElementById("itemsList");
        container.innerHTML = "";
        if (snapshot.empty) {
          container.innerHTML = "<p>No items yet.</p>";
          return;
        }
        snapshot.forEach(doc => {
          const data = doc.data();
          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div style="flex:1">
              <b>${data.serial}</b> — ${data.name}<br/>
              <small>Process: ${data.processName || "-"} | Contractor: ${data.contractorCode || "-"}</small>
            </div>
            <div class="qr-wrap">
              <button onclick="openItem('${doc.id}', '${data.publicUrl || ''}')">Open</button>
              <button onclick="showQR('${doc.id}', '${data.publicUrl || ''}')">QR</button>
              <button onclick="showBarcode('${data.serial}', '${doc.id}')">Barcode</button>
              <button style="color:#900" onclick="deleteItem('${doc.id}')">Delete</button>
            </div>
          `;
          container.appendChild(row);
        });
      });

      // Expose helpers
      window.openItem = (id, url) => {
        window.open(url || `${location.origin}/item.html?id=${id}`, "_blank");
      }
      window.deleteItem = async (id) => {
        if (confirm("Delete this item?")) await db.collection("items").doc(id).delete();
      }
      window.showQR = (id, url) => {
        const link = url || `${location.origin}/item.html?id=${id}`;
        const win = window.open("", "_blank", "width=420,height=520");
        win.document.write(`<body><h3>QR Code</h3><div id="qrcode"></div><p>${link}</p><button onclick="print()">Print</button></body>`);
        win.document.close();
        const script = win.document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
        script.onload = () => { new win.QRCode(win.document.getElementById("qrcode"), { text: link, width:280, height:280 }); };
        win.document.head.appendChild(script);
      }
      window.showBarcode = (serial, id) => {
        const win = window.open("", "_blank", "width=420,height=300");
        win.document.write(`<body><svg id="barcode"></svg><p>${serial}</p><button onclick="print()">Print</button></body>`);
        win.document.close();
        const script = win.document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js";
        script.onload = () => { win.JSBarcode(win.document.getElementById("barcode"), serial, {format:"CODE128", width:2, height:60, displayValue:true}); };
        win.document.head.appendChild(script);
      }
    }
  </script>
</body>
</html>
